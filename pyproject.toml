[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immersjp"
version = "0.1.0"
description = "Adaptive Japanese immersion platform built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ImmersJP contributors" }]
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "email-validator==2.3.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "itsdangerous==2.1.2",
    "jinja2==3.1.6",
    "passlib[bcrypt]==1.7.4",
    "psycopg[binary]==3.2.10",
    "pydantic-settings==2.10.1",
    "PyJWT==2.10.1",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",
    "redis==6.4.0",
    "reportlab==4.4.3",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "mypy>=1.11,<2",
    "pre-commit>=4.0,<5",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = [
    "frontend/static/*",
    "frontend/static/**/*",
    "frontend/templates/*",
    "frontend/templates/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
python_files = ["*_test.py", "test_*.py"]
testpaths = ["src/backend/tests"]

[tool.coverage.run]
branch = true
source = ["src/backend"]
omit = ["src/backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["build", "venv"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "E",    # pycodestyle errors
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "N802",  # allow lower_case function names in some contexts
    "N803",  # allow argument name style
    "N806",  # allow non-lowercase variable
    "E501",  # line-length enforced by formatter
    "RUF001",  # ambiguous character detection false-positives for Russian
    "RUF003",  # ambiguous character detection false-positives for Russian
    "RUF006",  # create_task reference false-positive with fire-and-forget pattern
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/backend/delivery/api/v1/helpers.py" = ["F401"]
"src/backend/dependencies/settings.py" = ["F401"]
"src/backend/infrastructure/external/huggingface_llm_client.py" = ["F401"]
"src/backend/tests/*" = ["ARG001", "ARG002", "ARG005"]
"src/backend/infrastructure/external/llm/*.py" = ["F821", "ARG004", "ARG003"]
"src/backend/infrastructure/external/pdf_builder.py" = ["ARG003"]
"src/backend/infrastructure/external/qwen_client.py" = ["ARG002"]
"src/backend/infrastructure/models/*.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
exclude = "(^venv/|^build/|^src/backend/tests/)"
files = [
    "src/backend/delivery/api",
    "src/backend/dto",
    "src/backend/infrastructure/security",
    "src/backend/infrastructure/web",
    "src/backend/infrastructure/observability",
    "src/backend/repository",
    "src/backend/services",
    "src/backend/use_case",
]
follow_imports = "skip"
ignore_missing_imports = true
mypy_path = "."
pretty = true
show_error_codes = true
warn_unused_configs = true
