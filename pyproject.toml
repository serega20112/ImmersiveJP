[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immersjp"
version = "0.1.0"
description = "Adaptive Japanese immersion platform built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ImmersJP contributors" }]
dependencies = [
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "email-validator==2.3.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "itsdangerous==2.1.2",
    "jinja2==3.1.6",
    "passlib[bcrypt]==1.7.4",
    "psycopg[binary]==3.2.10",
    "pydantic-settings==2.10.1",
    "PyJWT==2.10.1",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",
    "redis==6.4.0",
    "reportlab==4.4.3",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "mypy>=1.11,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = [
    "frontend/static/*",
    "frontend/static/**/*",
    "frontend/templates/*",
    "frontend/templates/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
python_files = ["*_test.py", "test_*.py"]
testpaths = ["src/backend/tests"]

[tool.coverage.run]
branch = true
source = ["src/backend"]
omit = ["src/backend/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["build", "venv"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
exclude = "(^venv/|^build/|^src/backend/tests/)"
files = [
    "src/backend/delivery/api",
    "src/backend/dto",
    "src/backend/infrastructure/security",
    "src/backend/repository",
    "src/backend/services",
    "src/backend/use_case/mappers.py",
]
follow_imports = "skip"
ignore_missing_imports = true
mypy_path = "."
pretty = true
show_error_codes = true
warn_unused_configs = true
